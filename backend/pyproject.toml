[project]
name = "kitchen-copilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pipecat-ai[daily,deepgram,silero]>=0.0.60",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
