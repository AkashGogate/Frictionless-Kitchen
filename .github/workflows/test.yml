name: backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/test.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest sqlalchemy aiosqlite greenlet httpx
      - run: pytest -v
